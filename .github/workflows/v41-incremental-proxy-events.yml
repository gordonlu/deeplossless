/// Source-backed variant used by the durable message pipeline.
///
/// `message_ids` must be positionally aligned with `messages`. Events derived
/// from those messages are inserted idempotently, while the request-start event
/// remains append-only because each invocation represents a real request.
pub fn extract_and_insert_with_message_ids(
    conn: &Connection,
    session_id: &str,
    messages: &[serde_json::Value],
    message_ids: &[i64],
) -> anyhow::Result<usize> {
    anyhow::ensure!(
        messages.len() == message_ids.len(),
        "messages/message_ids length mismatch: {} != {}",
        messages.len(),
        message_ids.len()
    );
    extract_and_insert_impl(conn, session_id, messages, Some(message_ids))
}

fn extract_and_insert_impl(
    conn: &Connection,
    session_id: &str,
    messages: &[serde_json::Value],
    message_ids: Option<&[i64]>,
) -> anyhow::Result<usize> {
    let now = chrono::Utc::now().to_rfc3339();
    let mut count = 0;

    let mut emit = |message_index: usize,
                    source_kind: &str,
                    source_ordinal: usize,
                    event: ProxyEvent|
     -> anyhow::Result<()> {
        let inserted = if let Some(ids) = message_ids {
            insert_source_event(
                conn,
                &event,
                ids[message_index],
                source_kind,
                source_ordinal,
            )?
            .is_some()
        } else {
            insert_event(conn, &event)?;
            true
        };
        if inserted {
            count += 1;
        }
        Ok(())
    };

    for (message_index, msg) in messages.iter().enumerate() {
        let role = msg["role"].as_str().unwrap_or("");
        match role {
            "user" => {
                let content = msg["content"].as_str().unwrap_or("");
                if content.is_empty() {
                    continue;
                }
                emit(
                    message_index,
                    "user_text",
                    0,
                    ProxyEvent {
                        id: None,
                        event_type: EventType::UserMessage,
                        session_id: session_id.to_string(),
                        timestamp: now.clone(),
                        tool_name: None,
                        path: None,
                        status: None,
                        content: content.to_string(),
                        metadata: serde_json::json!({"role": role}),
                    },
                )?;
            }

            "assistant" => {
                let content = msg["content"].as_str().unwrap_or("");
                if !content.is_empty() {
                    emit(
                        message_index,
                        "assistant_text",
                        0,
                        ProxyEvent {
                            id: None,
                            event_type: EventType::AssistantMessage,
                            session_id: session_id.to_string(),
                            timestamp: now.clone(),
                            tool_name: None,
                            path: None,
                            status: None,
                            content: content.to_string(),
                            metadata: serde_json::json!({"role": role}),
                        },
                    )?;
                }

                if let Some(tool_calls) = msg["tool_calls"].as_array() {
                    for (ordinal, tc) in tool_calls.iter().enumerate() {
                        let name = tc["function"]["name"].as_str().unwrap_or("");
                        let args = tc["function"]["arguments"].as_str().unwrap_or("");
                        let tc_id = tc["id"].as_str().unwrap_or("");
                        emit(
                            message_index,
                            "tool_call",
                            ordinal,
                            ProxyEvent {
                                id: None,
                                event_type: EventType::ToolCall,
                                session_id: session_id.to_string(),
                                timestamp: now.clone(),
                                tool_name: Some(name.to_string()),
                                path: self::tool_arg_path(name, args),
                                status: None,
                                content: format!("{name}({args})"),
                                metadata: serde_json::json!({"tool_call_id": tc_id, "tool_name": name, "args": args}),
                            },
                        )?;
                    }
                }
            }

            "tool" => {
                let content = msg["content"].as_str().unwrap_or("");
                let tc_id = msg["tool_call_id"].as_str().unwrap_or("");
                emit(
                    message_index,
                    "tool_result",
                    0,
                    ProxyEvent {
                        id: None,
                        event_type: EventType::ToolResult,
                        session_id: session_id.to_string(),
                        timestamp: now.clone(),
                        tool_name: None,
                        path: None,
                        status: if content.contains("error") || content.contains("Error") {
                            Some("error".into())
                        } else {
                            Some("success".into())
                        },
                        content: content.to_string(),
                        metadata: serde_json::json!({"tool_call_id": tc_id}),
                    },
                )?;
            }

            _ => {}
        }
    }

    insert_event(
        conn,
        &ProxyEvent {
            id: None,
            event_type: EventType::RequestStart,
            session_id: session_id.to_string(),
            timestamp: now,
            tool_name: None,
            path: None,
            status: None,
            content: String::new(),
            metadata: serde_json::json!({"msg_count": messages.len()}),
        },
    )?;
    count += 1;

    Ok(count)
}
