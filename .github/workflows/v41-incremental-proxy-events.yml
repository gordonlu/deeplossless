    #[test]
    fn source_event_is_idempotent_and_fts_is_not_duplicated() {
        let conn = temp_conn();
        let event = ev(EventType::UserMessage, "durable needle");
        let first = insert_source_event(&conn, &event, 41, "user_text", 0).unwrap();
        let second = insert_source_event(&conn, &event, 41, "user_text", 0).unwrap();
        assert!(first.is_some());
        assert!(second.is_none());
        assert_eq!(count(&conn), 1);

        let f = EventFilter {
            content_match: Some("durable".into()),
            ..Default::default()
        };
        assert_eq!(query_events(&conn, &f).unwrap().len(), 1);
    }

    #[test]
    fn cumulative_history_replay_only_adds_request_start() {
        let conn = temp_conn();
        let messages = serde_json::json!([
            {"role":"user","content":"hello"},
            {"role":"assistant","content":"hi","tool_calls":[
                {"id":"c1","function":{"name":"read_file","arguments":"{\\"path\\":\\"a.rs\\"}"}}
            ]},
            {"role":"tool","tool_call_id":"c1","content":"contents"}
        ]);
        let arr = messages.as_array().unwrap();
        let ids = [101, 102, 103];

        let first = extract_and_insert_with_message_ids(&conn, "s", arr, &ids).unwrap();
        let total_after_first = count(&conn);
        let second = extract_and_insert_with_message_ids(&conn, "s", arr, &ids).unwrap();
        let total_after_second = count(&conn);

        assert_eq!(first, 5); // user + assistant + tool call + tool result + request start
        assert_eq!(second, 1); // a real new request start only
        assert_eq!(total_after_second, total_after_first + 1);
    }

    #[test]
    fn source_identity_keeps_same_content_from_distinct_messages() {
        let conn = temp_conn();
        let event = ev(EventType::UserMessage, "same text");
        assert!(insert_source_event(&conn, &event, 1, "user_text", 0).unwrap().is_some());
        assert!(insert_source_event(&conn, &event, 2, "user_text", 0).unwrap().is_some());
        assert_eq!(count(&conn), 2);
    }
