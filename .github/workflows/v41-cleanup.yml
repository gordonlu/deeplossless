name: V4.1 Diff Cleanup

on:
  push:
    branches: [v41-runtime-simplification]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-runtime-simplification
          fetch-depth: 0
      - name: Remove unrelated rustfmt churn
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          allowed='^(README\.md|docs/tech-reference\.md|docs/v41-runtime-review\.md|src/execution\.rs|src/lib\.rs|src/main\.rs|src/runtime\.rs|src/summarizer\.rs|src/tool_cache\.rs|src/prefix_stability\.rs|\.github/workflows/v41-cleanup\.yml)$'
          while IFS= read -r f; do
            if [[ ! "$f" =~ $allowed ]]; then
              if git cat-file -e "origin/master:$f" 2>/dev/null; then
                git checkout origin/master -- "$f"
              else
                git rm -f --ignore-unmatch "$f"
              fi
            fi
          done < <(git diff --name-only origin/master...HEAD)
      - name: Verify
        run: |
          cargo test --lib
          cargo clippy --lib -- -D warnings
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: remove unrelated formatting churn"
          git push origin HEAD:v41-runtime-simplification
