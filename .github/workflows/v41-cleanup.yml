name: V4.1 Diff Cleanup

on:
  push:
    branches: [v41-runtime-simplification]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-runtime-simplification
          fetch-depth: 0
      - name: Rebuild semantic diff from master
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          subprocess.run(["git","fetch","origin","master"], check=True)
          targets = ["README.md","docs/tech-reference.md","src/execution.rs","src/lib.rs","src/main.rs","src/runtime.rs","src/summarizer.rs","src/tool_cache.rs","src/prefix_stability.rs"]
          subprocess.run(["git","checkout","origin/master","--",*targets], check=True)

          def rep(path, old, new, n=1):
              p=Path(path); s=p.read_text(); c=s.count(old); assert c>=n, f"{path}: {old[:40]!r} matches={c}"; p.write_text(s.replace(old,new,n))

          # exact cache replay
          p=Path("src/tool_cache.rs"); s=p.read_text()
          a=s.index("/// Transform a cached result before injecting it into the stream.")
          b=s.index("/// Convenience: compute cache key tuple",a)
          s=s[:a]+'''/// Return the exact cached tool result.\n///\n/// Cache reuse is an execution optimization, not a context-compression step.\n/// A cache hit must preserve the observable semantics of executing the tool.\npub fn transform_result(_tool_name: &str, raw_result: &str) -> String {\n    raw_result.to_string()\n}\n\n'''+s[b:]
          t0=s.index("    // ── Transform ─"); t1=s.index("    // ── L2 invalidation ─",t0)
          s=s[:t0]+'''    // ── Transform / exact replay ───────────────────────────────────────\n\n    #[test]\n    fn transform_read_file_preserves_exact_result() {\n        let raw = "pub fn foo() {\\n    let x = 1;\\n}\\n";\n        assert_eq!(transform_result("read_file", raw), raw);\n    }\n\n    #[test]\n    fn transform_list_files_preserves_all_entries() {\n        let raw = "a\\nb\\nc\\nd\\ne\\nf\\n";\n        assert_eq!(transform_result("list_files", raw), raw);\n    }\n\n    #[test]\n    fn transform_result_never_panics_on_weird_input() {\n        let raw = "\\0\\n\\x01\\n\\x02";\n        assert_eq!(transform_result("read_file", raw), raw);\n        assert_eq!(transform_result("unknown_tool", raw), raw);\n    }\n\n'''+s[t1:]
          p.write_text(s)

          # exit-code correctness + no inferred reasoning labels
          p=Path("src/execution.rs"); s=p.read_text()
          a=s.index("                // Infer outcome from result using structured patterns")
          b=s.index("                // Get reasoning_after from the next assistant message",a)
          region=s[a:b]; assert 'lower.contains("exit code")' in region
          s=s[:a]+'''                // Infer outcome from result using structured patterns.\n                // An explicit zero exit code is success; only non-zero codes are failures.\n                let outcome = {\n                    let lower = tool_result.to_lowercase();\n                    let nonzero_exit = parse_exit_code(&lower).is_some_and(|code| code != 0);\n                    if tool_result.contains("Error:") || tool_result.contains("error:")\n                        || tool_result.contains("error[") || tool_result.contains("Error[")\n                        || tool_result.contains("\\nerror") || tool_result.starts_with("error")\n                        || lower.contains("failed:") || nonzero_exit\n                        || lower.contains("timed out") || lower.contains("permission denied")\n                        || lower.contains("not found") || lower.starts_with("err:")\n                    {\n                        ExecutionOutcome::RecoveredFailure\n                    } else if tool_result.is_empty() {\n                        ExecutionOutcome::Blocked\n                    } else {\n                        ExecutionOutcome::Success\n                    }\n                };\n\n'''+s[b:]
          marker="/// Group normalized messages into execution units."
          helper='''fn parse_exit_code(text: &str) -> Option<i32> {\n    for marker in ["exit code", "exit_code", "exit status", "exit_status"] {\n        if let Some(pos) = text.find(marker) {\n            let tail = &text[pos + marker.len()..];\n            let token = tail\n                .trim_start_matches(|c: char| c.is_whitespace() || matches!(c, ':' | '=' | '('))\n                .split(|c: char| c.is_whitespace() || matches!(c, ')' | ',' | ';'))\n                .next()?;\n            if let Ok(code) = token.parse::<i32>() { return Some(code); }\n        }\n    }\n    None\n}\n\n'''
          assert s.count(marker)==1; s=s.replace(marker,helper+marker,1)
          a=s.index("        let reasoning_steps = {",s.index("pub fn new_with_span")); b=s.index("\n\n        Self {",a)
          assert "ReasoningKind::Assumption" in s[a:b]
          s=s[:a]+'''        // Free-form model reasoning is evidence, not typed execution truth.\n        // Semantic labels require explicit evidence from the typed fact / validation pipeline.\n        let reasoning_steps = Vec::new();'''+s[b:]
          p.write_text(s)

          # V4.1 defaults
          rep("src/summarizer.rs",'model: "deepseek-v4-flash".to_string(),','model: "deepseek-flash".to_string(),')
          rep("src/main.rs",'#[arg(long, default_value = "deepseek-v4-pro", env = "SUMMARIZER_MODEL")]','#[arg(long, default_value = "deepseek-flash", env = "SUMMARIZER_MODEL")]')

          # runtime: grounded default policy; failure history as evidence only
          p=Path("src/runtime.rs"); s=p.read_text()
          a=s.index("struct RetryWithFixRule;"); b=s.index("struct ReplanRule;",a); s=s[:a]+s[b:]
          a=s.index("struct TokenCriticalRule;"); b=s.index("/// Default set of decision rules",a); s=s[:a]+s[b:]
          s=s.replace("/// Default set of decision rules (cache → retry → replan → continue → token).\n","/// Default set of decision rules. Grounded execution signals only.\n",1)
          old='''    vec![\n        Box::new(CacheReuseRule),\n        Box::new(RetryWithFixRule),\n        Box::new(ReplanRule),\n        Box::new(ContinuePlanRule),\n        Box::new(TokenCriticalRule),\n    ]'''
          new='''    vec![\n        Box::new(CacheReuseRule),\n        Box::new(ReplanRule),\n        Box::new(ContinuePlanRule),\n    ]'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("/// Create an engine with the default rule set (cache/retry/replan/continue/token).","/// Create an engine with the default grounded rule set (cache/replan/continue).",1)
          f0=s.index("/// Proactively load failure patterns for a conversation"); f1=s.index("/// Proactively load the active plan for a conversation",f0)
          s=s[:f0]+'''/// Load recent failure evidence for the next request.\n/// Historical fixes are evidence only; the current model decides what to do.\npub fn evaluate_failure_context(\n    db: &crate::db::Database,\n    conv_id: i64,\n    _cycle: &ExecutionCycle,\n) -> Option<String> {\n    let patterns = db.get_recent_failure_patterns(conv_id, 3).ok()?;\n    let best = patterns.first()?;\n    let mut lines = vec![format!("[Previous failure evidence: {}]", best.signature)];\n    if !best.why_failed.is_empty() { lines.push(format!("[Observed reason: {}]", best.why_failed)); }\n    if !best.attempted_fix.is_empty() {\n        lines.push(format!("[Previously attempted fix (historical evidence, not a recommendation): {}]", best.attempted_fix));\n    }\n    if !best.invalidated_assumptions.is_empty() {\n        lines.push(format!("[Invalidated assumptions: {}]", best.invalidated_assumptions.join(", ")));\n    }\n    Some(lines.join("\\n"))\n}\n\n'''+s[f1:]
          old='''    #[test]\n    fn token_critical_triggers_compact() {\n        let mut state = make_state(RuntimeProfile::Efficient, None, None, None);\n        state.metrics.budget_remaining_pct = 0.10;\n        let d = RuntimePolicy::decide(&state);\n        assert!(matches!(d.action, RuntimeAction::CompactAndProceed));\n    }\n'''
          new='''    #[test]\n    fn token_pressure_does_not_override_model_by_default() {\n        let mut state = make_state(RuntimeProfile::Efficient, None, None, None);\n        state.metrics.budget_remaining_pct = 0.10;\n        let d = RuntimePolicy::decide(&state);\n        assert!(matches!(d.action, RuntimeAction::DelegateToModel));\n    }\n'''
          assert old in s; s=s.replace(old,new,1)
          s=s.replace("fn evaluate_failure_context_returns_fix_context_with_pattern()","fn evaluate_failure_context_returns_evidence_with_pattern()",1)
          s=s.replace('"should return context with fix suggestion"','"should return failure evidence"',1)
          s=s.replace('"context should mention the suggested fix"','"context should retain the historical fix as evidence"',1)
          s=s.replace("    let estimated_saved =\n        m.cache_hits * 350 + m.cache_misses.saturating_sub(m.repeated_failures) * 100;\n","",2)
          s=s.replace('    out.push_str("## Inference Economics\\n\\n| Metric | Estimate |\\n|--------|----------|\\n");\n    out.push_str(&format!(\n        "| Estimated tokens avoided | ~{estimated_saved} |\\n"\n    ));\n','    out.push_str("## Observed Runtime\\n\\n| Metric | Value |\\n|--------|-------|\\n");\n',1)
          s=s.replace('<text x="180" y="255" font-family="monospace" font-size="15" fill={grey} text-anchor="middle">Tokens avoided</text>\n  <text x="180" y="295" font-family="monospace" font-size="32" font-weight="bold" fill={green} text-anchor="middle">~{estimated_saved}</text>','<text x="180" y="255" font-family="monospace" font-size="15" fill={grey} text-anchor="middle">Tool calls reused</text>\n  <text x="180" y="295" font-family="monospace" font-size="32" font-weight="bold" fill={green} text-anchor="middle">{cache_hits}</text>',1)
          s=s.replace('label = label, estimated_saved = estimated_saved,\n        cache_hits = m.cache_hits,','label = label,\n        cache_hits = m.cache_hits,',1)
          p.write_text(s)

          # remove dead prefix stability
          rep("src/lib.rs","pub mod prefix_stability;\n","")
          Path("src/prefix_stability.rs").unlink()
          p=Path("docs/tech-reference.md"); s=p.read_text(); a=s.index("### Prefix Stability (`src/prefix_stability.rs`)"); b=s.index("### CLI Flags",a); s=s[:a]+s[b:]
          s=s.replace("| **Runtime Policy** | Advisory decisions with confidence scores + estimated token savings |","| **Runtime Policy** | Advisory decisions based on grounded execution state; model autonomy remains the default fallback |",1); p.write_text(s)

          # README positioning
          p=Path("README.md"); s=p.read_text()
          s=s.replace('An **inference-aware coding runtime** that reduces repeated work in long AI\ncoding sessions.','A **durable execution-state runtime** for long AI coding sessions. It preserves exact\nevidence, avoids repeated execution, and gives agents a rebuildable working state.')
          s=s.replace('Long context windows are not memory. Repeated inference is waste.','Long context windows are useful. Durable execution state is different.')
          s=s.replace('- **Repeated tool calls** — cached results returned inline, zero API tokens spent\n- **File reads** — structured summaries instead of raw content dumps\n- **Failed fixes** — remembers what didn\'t work and why\n- **Plans** — persists execution state across turns, avoids replanning','- **Repeated deterministic tool calls** — exact cached results, invalidated when dependencies change\n- **File observations** — versioned evidence instead of stale conversational recollection\n- **Failed attempts** — preserves what failed and why as evidence, without forcing an old fix\n- **Plans** — persists typed execution state and revalidates dependencies\n- **Working context** — recalls and compacts projections while Ground Truth stays exact')
          s=s.replace('| `--summarizer-model` | `deepseek-v4-pro` | Model for background summarization |','| `--summarizer-model` | `deepseek-flash` | Model for optional background summarization |')
          s=s.replace('Protocol translation and tool cache interception work transparently.\nThe proxy translates Codex\'s Responses API requests to DeepSeek Chat Completions,\nand converts streaming responses back to Responses SSE format.','DeepSeek Responses requests stay native end-to-end. DeepLossless records exact provider\nitems, derives execution state and working context internally, then forwards native Responses\nJSON/SSE without translating it through Chat Completions.')
          s=s.replace('21 cache hits · 3 failure loops broken · ~8,400 tokens avoided','21 exact cache reuses · 3 recorded failure loops')
          p.write_text(s)

      - name: Verify clean patch
        run: |
          cargo fmt --check
          cargo test --lib
          cargo clippy --lib -- -D warnings
      - name: Commit clean semantic diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: rebuild clean V4.1 semantic diff"
          git push origin HEAD:v41-runtime-simplification
