name: V4.1 Diff Cleanup

on:
  push:
    branches: [v41-runtime-simplification]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-runtime-simplification
          fetch-depth: 0
      - name: Rebuild clean semantic diff
        run: |
          git fetch origin master
          git diff -w origin/master 76fe47076781ba296848516490aee86a5aaf5567 -- \
            README.md docs/tech-reference.md \
            src/execution.rs src/lib.rs src/main.rs src/runtime.rs \
            src/summarizer.rs src/tool_cache.rs src/prefix_stability.rs \
            > /tmp/v41-semantic.patch
          git checkout origin/master -- \
            README.md docs/tech-reference.md \
            src/execution.rs src/lib.rs src/main.rs src/runtime.rs \
            src/summarizer.rs src/tool_cache.rs src/prefix_stability.rs
          git apply --ignore-space-change --ignore-whitespace /tmp/v41-semantic.patch
      - name: Verify clean patch
        run: |
          cargo fmt --check
          cargo test --lib
          cargo clippy --lib -- -D warnings
      - name: Commit clean semantic diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: rebuild clean V4.1 semantic diff"
          git push origin HEAD:v41-runtime-simplification
