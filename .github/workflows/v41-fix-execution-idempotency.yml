name: V41 Fix Execution Idempotency

on:
  push:
    branches: [v41-fix-execution-idempotency]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-fix-execution-idempotency
          fetch-depth: 0
      - name: Apply focused bug fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Execution replay: return the real durable id and whether this call inserted it.
          p = Path('src/db.rs')
          s = p.read_text()
          start = s.index('    pub fn store_execution_unit_with_span(\n')
          end = s.index('\n    /// Get execution units for a conversation', start)
          old = s[start:end]
          once = old.replace(
              '    pub fn store_execution_unit_with_span(\n',
              '    pub fn store_execution_unit_with_span_once(\n',
              1,
          ).replace(
              '    ) -> anyhow::Result<i64> {\n',
              '    ) -> anyhow::Result<(i64, bool)> {\n',
              1,
          )
          old_dedup = '''        // Dedup: skip if we already stored this tool execution.\n        // Prevents re-processing conversation history as execution events.\n        if !tool_call_id.is_empty() {\n            let exists: bool = conn.query_row(\n                "SELECT COUNT(*) > 0 FROM execution_units WHERE conv_id = ?1 AND tool_call_id = ?2 AND tool_name = ?3",\n                rusqlite::params![conv_id, tool_call_id, tool_name],\n                |row| row.get(0),\n            ).unwrap_or(false);\n            if exists {\n                return Ok(0); // already stored — skip\n            }\n        }\n'''
          new_dedup = '''        // Full-history clients resend old tool calls. Return the durable row id\n        // without replaying persistent side effects. Use the actual schema column\n        // and the same identity as idx_execution_dedup.\n        if !tool_call_id.is_empty() {\n            let existing_id = conn.query_row(\n                "SELECT id FROM execution_units WHERE conversation_id = ?1 AND tool_call_id = ?2 LIMIT 1",\n                rusqlite::params![conv_id, tool_call_id],\n                |row| row.get::<_, i64>(0),\n            ).ok();\n            if let Some(id) = existing_id {\n                return Ok((id, false));\n            }\n        }\n'''
          assert once.count(old_dedup) == 1, once.count(old_dedup)
          once = once.replace(old_dedup, new_dedup, 1)
          once = once.replace(
              '        if conn.changes() == 0 { return Ok(0); } // duplicate, skipped\n',
              '''        if conn.changes() == 0 {\n            let id = conn.query_row(\n                "SELECT id FROM execution_units WHERE conversation_id = ?1 AND tool_call_id = ?2 LIMIT 1",\n                rusqlite::params![conv_id, tool_call_id],\n                |row| row.get::<_, i64>(0),\n            )?;\n            return Ok((id, false));\n        }\n''',
              1,
          )
          once = once.replace('        Ok(exec_id)\n', '        Ok((exec_id, true))\n', 1)

          wrapper = '''    /// Store an execution unit and return its durable ID.\n    ///\n    /// Compatibility wrapper for callers that do not need to distinguish a fresh\n    /// insert from cumulative-history replay. Duplicate calls return the existing\n    /// execution id rather than the old sentinel value 0.\n    pub fn store_execution_unit_with_span(\n        &self,\n        conv_id: i64,\n        reasoning_before: &str,\n        tool_name: &str,\n        tool_args: &str,\n        tool_result: &str,\n        reasoning_after: &str,\n        outcome: &str,\n        related_nodes: &[i64],\n        span_id: &str,\n        parent_span_id: &str,\n        span_mode: &str,\n        parallel_group: &str,\n        tool_call_id: &str,\n        replay_session_id: &str,\n    ) -> anyhow::Result<i64> {\n        self.store_execution_unit_with_span_once(\n            conv_id,\n            reasoning_before,\n            tool_name,\n            tool_args,\n            tool_result,\n            reasoning_after,\n            outcome,\n            related_nodes,\n            span_id,\n            parent_span_id,\n            span_mode,\n            parallel_group,\n            tool_call_id,\n            replay_session_id,\n        )\n        .map(|(id, _inserted)| id)\n    }\n\n'''
          s = s[:start] + wrapper + once + s[end:]

          # 2) Lineage: clean historical duplicates without adding another SQLite index page,
          # then make the writer-lock-protected insert explicitly idempotent.
          fn_start = s.index('    pub fn insert_lineage_edge(')
          fn_end = s.index('\n    ///', fn_start)
          old_lineage_fn = s[fn_start:fn_end]
          new_lineage_fn = '''    pub fn insert_lineage_edge(&self, from_id: i64, to_id: i64, kind: &str) -> anyhow::Result<i64> {\n        let conn = self.writer.lock().unwrap_or_else(|e| e.into_inner());\n        if let Some(id) = conn\n            .query_row(\n                "SELECT id FROM lineage_edges WHERE from_id = ?1 AND to_id = ?2 AND kind = ?3 LIMIT 1",\n                rusqlite::params![from_id, to_id, kind],\n                |row| row.get::<_, i64>(0),\n            )\n            .ok()\n        {\n            return Ok(id);\n        }\n        conn.execute(\n            "INSERT INTO lineage_edges (from_id, to_id, kind) VALUES (?1, ?2, ?3)",\n            rusqlite::params![from_id, to_id, kind],\n        )?;\n        Ok(conn.last_insert_rowid())\n    }\n'''
          s = s[:fn_start] + new_lineage_fn + s[fn_end:]

          # Focused regression tests for both durable-id replay and lineage idempotency.
          insert_at = s.rfind('\n}')
          tests = r'''

    #[tokio::test]
    async fn execution_unit_replay_returns_existing_id_without_reinsert() {
        let dir = tempfile::tempdir().unwrap();
        let db = Database::builder()
            .path(dir.path().join("exec-replay-idempotent.db"))
            .build()
            .await
            .unwrap();
        let conv_id = db.find_or_create_conversation("exec-replay", "test").unwrap();

        let first = db.store_execution_unit_with_span_once(
            conv_id, "before", "read_file", "{}", "ok", "after", "success", &[],
            "", "", "", "", "call-1", "replay-1",
        ).unwrap();
        let second = db.store_execution_unit_with_span_once(
            conv_id, "before", "read_file", "{}", "ok", "after", "success", &[],
            "", "", "", "", "call-1", "replay-2",
        ).unwrap();

        assert!(first.1);
        assert!(!second.1);
        assert_eq!(first.0, second.0);
        assert_ne!(second.0, 0);
        let conn = db.read_conn();
        let count: i64 = conn.query_row(
            "SELECT COUNT(*) FROM execution_units WHERE conversation_id = ?1 AND tool_call_id = 'call-1'",
            rusqlite::params![conv_id],
            |row| row.get(0),
        ).unwrap();
        assert_eq!(count, 1);
    }

    #[tokio::test]
    async fn lineage_insert_is_idempotent_under_writer_lock() {
        let dir = tempfile::tempdir().unwrap();
        let db = Database::builder()
            .path(dir.path().join("lineage-idempotent.db"))
            .build()
            .await
            .unwrap();
        let first = db.insert_lineage_edge(10, 20, "depends_on").unwrap();
        let second = db.insert_lineage_edge(10, 20, "depends_on").unwrap();
        assert_eq!(first, second);
        let conn = db.read_conn();
        let count: i64 = conn.query_row(
            "SELECT COUNT(*) FROM lineage_edges WHERE from_id = 10 AND to_id = 20 AND kind = 'depends_on'",
            [],
            |row| row.get(0),
        ).unwrap();
        assert_eq!(count, 1);
    }
'''
          s = s[:insert_at] + tests + s[insert_at:]
          p.write_text(s)

          p = Path('src/execution.rs')
          s = p.read_text()
          old = '''    CREATE INDEX IF NOT EXISTS idx_lineage_from ON lineage_edges(from_id);\n    CREATE INDEX IF NOT EXISTS idx_lineage_to ON lineage_edges(to_id);";\n'''
          new = '''    CREATE INDEX IF NOT EXISTS idx_lineage_from ON lineage_edges(from_id);\n    CREATE INDEX IF NOT EXISTS idx_lineage_to ON lineage_edges(to_id);\n    DELETE FROM lineage_edges\n      WHERE id NOT IN (\n        SELECT MIN(id) FROM lineage_edges GROUP BY from_id, to_id, kind\n      );";\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) Pipeline: historical executions seed transient ordering/tracker state,
          # but only fresh execution rows may produce persistent derived side effects.
          p = Path('src/pipeline.rs')
          s = p.read_text()
          s = s.replace(
              '                let mut active_trackers: Vec<crate::parallel::ForkJoinTracker> = Vec::new();\n',
              '                let mut active_trackers: Vec<crate::parallel::ForkJoinTracker> = Vec::new();\n                let mut newly_inserted_parallel_groups = std::collections::HashSet::new();\n',
              1,
          )
          s = s.replace(
              '                    let exec_id = db.store_execution_unit_with_span(\n',
              '                    let (exec_id, inserted) = db.store_execution_unit_with_span_once(\n',
              1,
          )
          old_block = '''                    // Record DependsOn lineage edge: consecutive units in a conversation\n                    // form a dependency chain (unit N depends on unit N-1's output).\n                    if let Some(prev_id) = last_exec_id {\n                        if let Err(e) = db.insert_lineage_edge(prev_id, exec_id, "depends_on") {\n                            tracing::warn!(target: "deeplossless::pipeline",\n                                "failed to insert DependsOn edge: {e}");\n                        }\n                    }\n                    last_exec_id = Some(exec_id);\n\n                    // Update tracker with result\n                    if !unit.tool_call_id.is_empty() {\n                        for tracker in &mut active_trackers {\n                            if let Err(e) = tracker.record_branch_result(&unit.tool_call_id, exec_id, &unit.outcome) {\n                                tracing::debug!(target: "deeplossless::pipeline", "record_branch_result: {e}");\n                            }\n                        }\n                    }\n\n                    // Auto-populate execution artifact store from message history.\n'''
          new_block = '''                    // Historical units still seed ordering and transient parallel state so a\n                    // newly appended unit can depend on the real previous execution id.\n                    if inserted {\n                        if let Some(prev_id) = last_exec_id {\n                            if let Err(e) = db.insert_lineage_edge(prev_id, exec_id, "depends_on") {\n                                tracing::warn!(target: "deeplossless::pipeline",\n                                    "failed to insert DependsOn edge: {e}");\n                            }\n                        }\n                        if !parallel_group.is_empty() {\n                            newly_inserted_parallel_groups.insert(parallel_group.clone());\n                        }\n                    }\n                    last_exec_id = Some(exec_id);\n\n                    if !unit.tool_call_id.is_empty() {\n                        for tracker in &mut active_trackers {\n                            if let Err(e) = tracker.record_branch_result(&unit.tool_call_id, exec_id, &unit.outcome) {\n                                tracing::debug!(target: "deeplossless::pipeline", "record_branch_result: {e}");\n                            }\n                        }\n                    }\n\n                    if !inserted {\n                        continue;\n                    }\n\n                    // Auto-populate execution artifact store from message history.\n'''
          assert s.count(old_block) == 1, s.count(old_block)
          s = s.replace(old_block, new_block, 1)
          old_join = '''                    if !tracker.should_force_join() {\n                        continue;\n                    }\n'''
          new_join = '''                    if !tracker.should_force_join()\n                        || !newly_inserted_parallel_groups.contains(&tracker.group_id)\n                    {\n                        continue;\n                    }\n'''
          assert s.count(old_join) == 1, s.count(old_join)
          s = s.replace(old_join, new_join, 1)
          p.write_text(s)
          PY

          cargo fmt
          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.rs src/execution.rs src/pipeline.rs
          git commit -m "fix: make execution replay side effects idempotent"
          git push origin HEAD:v41-fix-execution-idempotency
