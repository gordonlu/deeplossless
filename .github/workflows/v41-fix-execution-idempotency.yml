name: V41 Fix Execution Idempotency

on:
  push:
    branches: [v41-fix-execution-idempotency]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-fix-execution-idempotency
          fetch-depth: 0
      - name: Apply focused bug fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) execution storage: return durable id + inserted status atomically.
          p = Path('src/db.rs')
          s = p.read_text()
          start = s.index('    pub fn store_execution_unit_with_span(\n')
          end = s.index('\n    /// Get execution units for a conversation', start)
          old = s[start:end]
          once = old.replace(
              '    pub fn store_execution_unit_with_span(\n',
              '    pub fn store_execution_unit_with_span_once(\n',
              1,
          ).replace(
              '    ) -> anyhow::Result<i64> {\n',
              '    ) -> anyhow::Result<(i64, bool)> {\n',
              1,
          )
          once = once.replace(
              '''        // Dedup: skip if we already stored this tool execution.\n        // Prevents re-processing conversation history as execution events.\n        if !tool_call_id.is_empty() {\n            let exists: bool = conn.query_row(\n                "SELECT COUNT(*) > 0 FROM execution_units WHERE conv_id = ?1 AND tool_call_id = ?2 AND tool_name = ?3",\n                rusqlite::params![conv_id, tool_call_id, tool_name],\n                |row| row.get(0),\n            ).unwrap_or(false);\n            if exists {\n                return Ok(0); // already stored — skip\n            }\n        }\n''',
              '''        // Dedup: return the durable execution id without replaying persistent side effects.\n        // Full-history clients resend old tool calls every turn, so this check must use\n        // the real schema column (`conversation_id`) and the same key as the UNIQUE index.\n        if !tool_call_id.is_empty() {\n            let existing_id = conn.query_row(\n                "SELECT id FROM execution_units WHERE conversation_id = ?1 AND tool_call_id = ?2 LIMIT 1",\n                rusqlite::params![conv_id, tool_call_id],\n                |row| row.get::<_, i64>(0),\n            ).ok();\n            if let Some(id) = existing_id {\n                return Ok((id, false));\n            }\n        }\n''',
              1,
          )
          once = once.replace(
              '        if conn.changes() == 0 { return Ok(0); } // duplicate, skipped\n',
              '''        if conn.changes() == 0 {\n            let id = conn.query_row(\n                "SELECT id FROM execution_units WHERE conversation_id = ?1 AND tool_call_id = ?2 LIMIT 1",\n                rusqlite::params![conv_id, tool_call_id],\n                |row| row.get::<_, i64>(0),\n            )?;\n            return Ok((id, false));\n        }\n''',
              1,
          )
          once = once.replace('        Ok(exec_id)\n', '        Ok((exec_id, true))\n', 1)

          wrapper = '''    /// Store an execution unit and return its durable ID.\n    ///\n    /// Compatibility wrapper: callers that do not need to distinguish a new insert\n    /// from cumulative-history replay still receive the real execution ID.\n    pub fn store_execution_unit_with_span(\n        &self,\n        conv_id: i64,\n        reasoning_before: &str,\n        tool_name: &str,\n        tool_args: &str,\n        tool_result: &str,\n        reasoning_after: &str,\n        outcome: &str,\n        related_nodes: &[i64],\n        span_id: &str,\n        parent_span_id: &str,\n        span_mode: &str,\n        parallel_group: &str,\n        tool_call_id: &str,\n        replay_session_id: &str,\n    ) -> anyhow::Result<i64> {\n        self.store_execution_unit_with_span_once(\n            conv_id,\n            reasoning_before,\n            tool_name,\n            tool_args,\n            tool_result,\n            reasoning_after,\n            outcome,\n            related_nodes,\n            span_id,\n            parent_span_id,\n            span_mode,\n            parallel_group,\n            tool_call_id,\n            replay_session_id,\n        )\n        .map(|(id, _inserted)| id)\n    }\n\n'''
          s = s[:start] + wrapper + once + s[end:]
          p.write_text(s)

          # 2) lineage must actually be idempotent: dedup old rows, then enforce uniqueness.
          p = Path('src/execution.rs')
          s = p.read_text()
          old = '''    CREATE INDEX IF NOT EXISTS idx_lineage_from ON lineage_edges(from_id);\n    CREATE INDEX IF NOT EXISTS idx_lineage_to ON lineage_edges(to_id);";\n'''
          new = '''    CREATE INDEX IF NOT EXISTS idx_lineage_from ON lineage_edges(from_id);\n    CREATE INDEX IF NOT EXISTS idx_lineage_to ON lineage_edges(to_id);\n    DELETE FROM lineage_edges\n      WHERE id NOT IN (\n        SELECT MIN(id) FROM lineage_edges GROUP BY from_id, to_id, kind\n      );\n    CREATE UNIQUE INDEX IF NOT EXISTS idx_lineage_unique\n        ON lineage_edges(from_id, to_id, kind);";\n'''
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, new, 1)
          p.write_text(s)

          # 3) pipeline: historical execution rows seed in-memory ordering/tracker state,
          # but never replay persistent artifact/failure/join side effects.
          p = Path('src/pipeline.rs')
          s = p.read_text()
          s = s.replace(
              '                let mut active_trackers: Vec<crate::parallel::ForkJoinTracker> = Vec::new();\n',
              '                let mut active_trackers: Vec<crate::parallel::ForkJoinTracker> = Vec::new();\n                let mut newly_inserted_parallel_groups = std::collections::HashSet::new();\n',
              1,
          )
          s = s.replace(
              '                    let exec_id = db.store_execution_unit_with_span(\n',
              '                    let (exec_id, inserted) = db.store_execution_unit_with_span_once(\n',
              1,
          )
          old_block = '''                    // Record DependsOn lineage edge: consecutive units in a conversation\n                    // form a dependency chain (unit N depends on unit N-1's output).\n                    if let Some(prev_id) = last_exec_id {\n                        if let Err(e) = db.insert_lineage_edge(prev_id, exec_id, "depends_on") {\n                            tracing::warn!(target: "deeplossless::pipeline",\n                                "failed to insert DependsOn edge: {e}");\n                        }\n                    }\n                    last_exec_id = Some(exec_id);\n\n                    // Update tracker with result\n                    if !unit.tool_call_id.is_empty() {\n                        for tracker in &mut active_trackers {\n                            if let Err(e) = tracker.record_branch_result(&unit.tool_call_id, exec_id, &unit.outcome) {\n                                tracing::debug!(target: "deeplossless::pipeline", "record_branch_result: {e}");\n                            }\n                        }\n                    }\n\n                    // Auto-populate execution artifact store from message history.\n'''
          new_block = '''                    // Historical units still seed ordering and in-memory parallel state so\n                    // a newly appended unit can depend on the real previous execution ID.\n                    // Only newly inserted executions may create persistent derived side effects.\n                    if inserted {\n                        if let Some(prev_id) = last_exec_id {\n                            if let Err(e) = db.insert_lineage_edge(prev_id, exec_id, "depends_on") {\n                                tracing::warn!(target: "deeplossless::pipeline",\n                                    "failed to insert DependsOn edge: {e}");\n                            }\n                        }\n                        if !parallel_group.is_empty() {\n                            newly_inserted_parallel_groups.insert(parallel_group.clone());\n                        }\n                    }\n                    last_exec_id = Some(exec_id);\n\n                    // Rebuild only transient tracker state from historical executions.\n                    if !unit.tool_call_id.is_empty() {\n                        for tracker in &mut active_trackers {\n                            if let Err(e) = tracker.record_branch_result(&unit.tool_call_id, exec_id, &unit.outcome) {\n                                tracing::debug!(target: "deeplossless::pipeline", "record_branch_result: {e}");\n                            }\n                        }\n                    }\n\n                    if !inserted {\n                        continue;\n                    }\n\n                    // Auto-populate execution artifact store from message history.\n'''
          assert s.count(old_block) == 1, s.count(old_block)
          s = s.replace(old_block, new_block, 1)
          s = s.replace(
              '''                    if !tracker.should_force_join() {\n                        continue;\n                    }\n''',
              '''                    if !tracker.should_force_join()\n                        || !newly_inserted_parallel_groups.contains(&tracker.group_id)\n                    {\n                        continue;\n                    }\n''',
              1,
          )
          p.write_text(s)
          PY

          cargo fmt
          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit focused fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.rs src/execution.rs src/pipeline.rs
          git commit -m "fix: make execution replay side effects idempotent"
          git push origin HEAD:v41-fix-execution-idempotency
