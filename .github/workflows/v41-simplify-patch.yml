name: V4.1 Simplification Patch

on:
  push:
    branches: [v41-runtime-simplification]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-runtime-simplification
      - name: Apply V4.1 simplification round two
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              count = s.count(old)
              assert count == 1, f"{path}: expected exactly one match, got {count}"
              p.write_text(s.replace(old, new, 1))

          # 1) Failure memory becomes evidence-only in the default path.
          p = Path("src/runtime.rs")
          s = p.read_text()
          a = s.index("struct RetryWithFixRule;")
          b = s.index("struct ReplanRule;", a)
          s = s[:a] + s[b:]

          # 2) Token pressure no longer competes as a RuntimePolicy heuristic.
          a = s.index("struct TokenCriticalRule;")
          b = s.index("/// Default set of decision rules", a)
          s = s[:a] + s[b:]
          s = s.replace(
              "/// Default set of decision rules (cache → retry → replan → continue → token).\n",
              "/// Default set of decision rules. Grounded execution signals only.\n",
              1,
          )
          old_rules = '''    vec![\n        Box::new(CacheReuseRule),\n        Box::new(RetryWithFixRule),\n        Box::new(ReplanRule),\n        Box::new(ContinuePlanRule),\n        Box::new(TokenCriticalRule),\n    ]'''
          new_rules = '''    vec![\n        Box::new(CacheReuseRule),\n        Box::new(ReplanRule),\n        Box::new(ContinuePlanRule),\n    ]'''
          assert old_rules in s
          s = s.replace(old_rules, new_rules, 1)
          s = s.replace(
              "/// Create an engine with the default rule set (cache/retry/replan/continue/token).",
              "/// Create an engine with the default grounded rule set (cache/replan/continue).",
              1,
          )

          # Failure context: preserve exact history as evidence, never as an instruction.
          f0 = s.index("/// Proactively load failure patterns for a conversation")
          f1 = s.index("/// Proactively load the active plan for a conversation", f0)
          failure_fn = '''/// Load recent failure evidence for the next request.\n///\n/// Historical fixes are evidence only. The runtime does not recommend replaying an old\n/// fix; the current model decides what to do with the recorded failure context.\npub fn evaluate_failure_context(\n    db: &crate::db::Database,\n    conv_id: i64,\n    _cycle: &ExecutionCycle,\n) -> Option<String> {\n    let patterns = db.get_recent_failure_patterns(conv_id, 3).ok()?;\n    let best = patterns.first()?;\n\n    let mut lines = vec![format!(\n        "[Previous failure evidence: {}]",\n        best.signature\n    )];\n    if !best.why_failed.is_empty() {\n        lines.push(format!("[Observed reason: {}]", best.why_failed));\n    }\n    if !best.attempted_fix.is_empty() {\n        lines.push(format!(\n            "[Previously attempted fix (historical evidence, not a recommendation): {}]",\n            best.attempted_fix\n        ));\n    }\n    if !best.invalidated_assumptions.is_empty() {\n        lines.push(format!(\n            "[Invalidated assumptions: {}]",\n            best.invalidated_assumptions.join(", ")\n        ));\n    }\n    Some(lines.join("\\n"))\n}\n\n'''
          s = s[:f0] + failure_fn + s[f1:]

          # Update focused tests for the new default behavior.
          old_test = '''    #[test]\n    fn token_critical_triggers_compact() {\n        let mut state = make_state(RuntimeProfile::Efficient, None, None, None);\n        state.metrics.budget_remaining_pct = 0.10;\n        let d = RuntimePolicy::decide(&state);\n        assert!(matches!(d.action, RuntimeAction::CompactAndProceed));\n    }\n'''
          new_test = '''    #[test]\n    fn token_pressure_does_not_override_model_by_default() {\n        let mut state = make_state(RuntimeProfile::Efficient, None, None, None);\n        state.metrics.budget_remaining_pct = 0.10;\n        let d = RuntimePolicy::decide(&state);\n        assert!(matches!(d.action, RuntimeAction::DelegateToModel));\n    }\n'''
          assert old_test in s
          s = s.replace(old_test, new_test, 1)
          s = s.replace(
              "fn evaluate_failure_context_returns_fix_context_with_pattern()",
              "fn evaluate_failure_context_returns_evidence_with_pattern()",
              1,
          )
          s = s.replace(
              '"should return context with fix suggestion"',
              '"should return failure evidence"',
              1,
          )
          s = s.replace(
              '"context should mention the suggested fix"',
              '"context should retain the historical fix as evidence"',
              1,
          )
          p.write_text(s)

          # 3) Remove dead prefix-stability implementation from production crate/docs.
          p = Path("src/lib.rs")
          s = p.read_text()
          assert s.count("pub mod prefix_stability;\n") == 1
          p.write_text(s.replace("pub mod prefix_stability;\n", "", 1))
          prefix = Path("src/prefix_stability.rs")
          assert prefix.exists()
          prefix.unlink()

          p = Path("docs/tech-reference.md")
          s = p.read_text()
          h0 = s.index("### Prefix Stability (`src/prefix_stability.rs`)")
          h1 = s.index("### CLI Flags", h0)
          s = s[:h0] + s[h1:]
          s = s.replace(
              "| **Runtime Policy** | Advisory decisions with confidence scores + estimated token savings |",
              "| **Runtime Policy** | Advisory decisions based on grounded execution state; model autonomy remains the default fallback |",
              1,
          )
          p.write_text(s)

          # 4) Session reporting uses observed counters, not invented token-savings arithmetic.
          p = Path("src/runtime.rs")
          s = p.read_text()
          s = s.replace(
              "    let estimated_saved =\n        m.cache_hits * 350 + m.cache_misses.saturating_sub(m.repeated_failures) * 100;\n",
              "",
              2,
          )
          s = s.replace(
              '    out.push_str("## Inference Economics\\n\\n| Metric | Estimate |\\n|--------|----------|\\n");\n    out.push_str(&format!(\n        "| Estimated tokens avoided | ~{estimated_saved} |\\n"\n    ));\n',
              '    out.push_str("## Observed Runtime\\n\\n| Metric | Value |\\n|--------|-------|\\n");\n',
              1,
          )
          s = s.replace(
              '<text x="180" y="255" font-family="monospace" font-size="15" fill={grey} text-anchor="middle">Tokens avoided</text>\n  <text x="180" y="295" font-family="monospace" font-size="32" font-weight="bold" fill={green} text-anchor="middle">~{estimated_saved}</text>',
              '<text x="180" y="255" font-family="monospace" font-size="15" fill={grey} text-anchor="middle">Tool calls reused</text>\n  <text x="180" y="295" font-family="monospace" font-size="32" font-weight="bold" fill={green} text-anchor="middle">{cache_hits}</text>',
              1,
          )
          s = s.replace(
              'label = label, estimated_saved = estimated_saved,\n        cache_hits = m.cache_hits,',
              'label = label,\n        cache_hits = m.cache_hits,',
              1,
          )
          p.write_text(s)

          p = Path("README.md")
          s = p.read_text()
          s = s.replace(
              "21 cache hits · 3 failure loops broken · ~8,400 tokens avoided",
              "21 exact cache reuses · 3 recorded failure loops",
          )
          p.write_text(s)

      - name: Format and test
        run: |
          cargo fmt
          cargo test --lib
          cargo clippy --lib -- -D warnings
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src docs README.md
          git commit -m "refactor: reduce heuristic runtime control for V4.1 Flash"
          git push origin HEAD:v41-runtime-simplification
