name: V41 Proxy Retry 4
on:
  push:
    branches:
      - v41-incremental-proxy-events
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-incremental-proxy-events
          fetch-depth: 0
      - name: Apply and validate patch
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          from pathlib import Path
          workflow = subprocess.check_output(['git','show','468c73b9a791293faf1684c70f94a762c38c427e:.github/workflows/v41-proxy-retry3.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, '<proxy-event-patch>', 'exec'))

          p = Path('src/event_store.rs')
          s = p.read_text()
          lines = s.splitlines()
          for i, line in enumerate(lines):
              if '"id":"c1"' in line and '"arguments"' in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i] = indent + r'{"id":"c1","function":{"name":"read_file","arguments":"{}"}}'
          p.write_text('\n'.join(lines) + '\n')
          PY
          cargo fmt
          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/event_store.rs src/pipeline.rs
          git commit -m "refactor: make proxy-event projection incremental"
          git push origin HEAD:v41-incremental-proxy-events
