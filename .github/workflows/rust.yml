name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast checks first — fail early
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib
        env:
          RUSTFLAGS: -A warnings

  # Unit tests only (no external dependencies)
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib
        env:
          RUSTFLAGS: -A warnings
          RUST_LOG: error

  # Integration tests (may need external infra)
  integration-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --tests
        env:
          RUSTFLAGS: -A warnings
          RUST_LOG: error

  # Doc tests
  doc:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Protocol compatibility — torture scenarios (no LLM needed)
  protocol-compat:
    name: protocol compat (${{ matrix.format }})
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    strategy:
      fail-fast: false
      matrix:
        format:
          - openai
          - claude_code
          - codex
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (${{ matrix.format }})
        run: |
          case "$FORMAT" in
            openai)       FILTER="drive_openai" ;;
            claude_code)  FILTER="drive_suite claude_code" ;;
            codex)        FILTER="drive_codex" ;;
          esac
          cargo test --lib torture::driver -- $FILTER --nocapture
        env:
          FORMAT: ${{ matrix.format }}
          RUSTFLAGS: -A warnings
          RUST_LOG: error
