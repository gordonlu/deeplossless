name: V4.1 Incremental Level0 Retry

on:
  push:
    branches: [v41-incremental-level0-projection]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-incremental-level0-projection
          fetch-depth: 0
      - name: Apply previous patch without redundant index
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          old = subprocess.check_output(
              ['git','show','aac712f0f8c44ca1a9f136f1b0f5a71ea748e1e4:.github/workflows/v41-incremental-level0.yml'],
              text=True,
          )
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY"
          start = old.index(start_marker) + len(start_marker)
          end = old.index(end_marker, start)
          code = textwrap.dedent(old[start:end])
          code = code.replace(
              '            CREATE INDEX IF NOT EXISTS idx_message_dag_projection_node\\n'
              '                ON message_dag_projection(dag_node_id);\\n',
              '',
          )
          exec(compile(code, '<incremental-level0-patch>', 'exec'))
          PY
          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --test perf_benchmark bench_memory_growth -- --nocapture
          cargo test --all-targets
          cargo build --release
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.rs src/dag.rs src/pipeline.rs src/responses_projection.rs
          git commit -m "refactor: make level-zero DAG projection incremental"
          git push origin HEAD:v41-incremental-level0-projection
