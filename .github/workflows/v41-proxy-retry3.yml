name: V41 Proxy Retry 3
on:
  push:
    branches:
      - v41-incremental-proxy-events
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-incremental-proxy-events
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          from pathlib import Path
          workflow = subprocess.check_output(['git','show','98535b13ba937ae83298ec07da67b26afd67a6c3:.github/workflows/v41-proxy-retry.yml'], text=True)
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          cut = code.rfind("p = Path('src/pipeline.rs')")
          assert cut > 0
          tail = "p = Path('src/pipeline.rs')\n"
          tail += "s = p.read_text()\n"
          tail += "old_call = 'crate::event_store::extract_and_insert(&conn, &event_session_id, arr)'\n"
          tail += "new_call = 'crate::event_store::extract_and_insert_with_message_ids(&conn, &event_session_id, arr, &message_ids)'\n"
          tail += "assert s.count(old_call) == 1, s.count(old_call)\n"
          tail += "s = s.replace(old_call, new_call, 1)\n"
          tail += "p.write_text(s)\n"
          code = code[:cut] + tail
          exec(compile(code, '<proxy-event-patch>', 'exec'))
          PY
          cargo fmt
          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/event_store.rs src/pipeline.rs
          git commit -m "refactor: make proxy-event projection incremental"
          git push origin HEAD:v41-incremental-proxy-events
