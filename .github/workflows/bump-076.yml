name: Bump 0.7.6

on:
  push:
    branches: [bump-0.7.6]

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bump-0.7.6
          fetch-depth: 0
      - name: Bump crate version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Cargo.toml')
          s = p.read_text()
          old = 'version = "0.7.5"'
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, 'version = "0.7.6"', 1))
          PY
          cargo check --locked || cargo check
          grep -A2 -B1 'name = "deeplossless"' Cargo.lock
          git diff --check
          cargo test --lib
      - name: Commit version bump
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to 0.7.6"
          git push origin HEAD:bump-0.7.6
