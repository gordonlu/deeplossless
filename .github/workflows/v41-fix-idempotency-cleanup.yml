name: V41 Fix Idempotency Cleanup

on:
  push:
    branches: [v41-fix-execution-idempotency]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-fix-execution-idempotency
          fetch-depth: 0
      - name: Rebuild clean semantic diff
        run: |
          git fetch origin master
          cp tests/execution_idempotency.rs /tmp/execution_idempotency.rs
          git diff -w origin/master HEAD -- \
            src/db.rs src/execution.rs src/pipeline.rs tests/proxy_integration.rs \
            > /tmp/idempotency-semantic.patch
          git checkout origin/master -- \
            src/db.rs src/execution.rs src/pipeline.rs tests/proxy_integration.rs
          git apply --ignore-space-change --ignore-whitespace /tmp/idempotency-semantic.patch
          cp /tmp/execution_idempotency.rs tests/execution_idempotency.rs

          git diff --check origin/master
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit clean semantic diff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.rs src/execution.rs src/pipeline.rs tests/execution_idempotency.rs tests/proxy_integration.rs
          git commit -m "chore: rebuild clean execution idempotency diff"
          git push origin HEAD:v41-fix-execution-idempotency
