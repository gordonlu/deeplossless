name: V4.1 Incremental Level0

on:
  push:
    branches: [v41-incremental-level0-projection]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v41-incremental-level0-projection
          fetch-depth: 0
      - name: Apply source-backed incremental projection
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              assert n == 1, f"{path}: expected one match, got {n}"
              p.write_text(s.replace(old, new, 1))

          # db.rs: durable message ids + one-to-one message -> leaf projection map.
          p = Path('src/db.rs')
          s = p.read_text()

          old = '''            CREATE TABLE IF NOT EXISTS dag_nodes (\n                id              INTEGER PRIMARY KEY AUTOINCREMENT,\n                conversation_id INTEGER NOT NULL REFERENCES conversations(id),'''
          new = '''            CREATE TABLE IF NOT EXISTS dag_nodes (\n                id              INTEGER PRIMARY KEY AUTOINCREMENT,\n                conversation_id INTEGER NOT NULL REFERENCES conversations(id),'''
          assert s.count(old) == 1
          # no structural change to dag_nodes; use sidecar mapping to avoid row decoder churn.

          anchor = '''            CREATE INDEX IF NOT EXISTS idx_embeddings_model\n                ON embeddings(model);\n        ")?;'''
          repl = '''            CREATE INDEX IF NOT EXISTS idx_embeddings_model\n                ON embeddings(model);\n\n            -- One durable message row projects to at most one level-0 DAG leaf.\n            -- Sidecar keeps the DAG node schema stable while making projection idempotent.\n            CREATE TABLE IF NOT EXISTS message_dag_projection (\n                message_id INTEGER PRIMARY KEY REFERENCES messages(id) ON DELETE CASCADE,\n                dag_node_id INTEGER NOT NULL UNIQUE REFERENCES dag_nodes(id) ON DELETE CASCADE,\n                created_at TEXT NOT NULL DEFAULT (datetime('now'))\n            );\n            CREATE INDEX IF NOT EXISTS idx_message_dag_projection_node\n                ON message_dag_projection(dag_node_id);\n        ")?;'''
          assert s.count(anchor) == 1
          s = s.replace(anchor, repl, 1)

          old = '''    /// Persist a request's `messages` array into an existing conversation.\n    /// Also extracts structured events into `proxy_events` for search.\n    pub fn store_messages(&self, conv_id: i64, messages: &serde_json::Value) -> anyhow::Result<()> {\n        let conn = self.writer.lock().unwrap_or_else(|e| e.into_inner());\n        let tx = conn.unchecked_transaction()?;'''
          new = '''    /// Persist a request's `messages` array into an existing conversation.\n    /// Existing callers that only need persistence can ignore stable row identities.\n    pub fn store_messages(&self, conv_id: i64, messages: &serde_json::Value) -> anyhow::Result<()> {\n        self.store_messages_with_ids(conv_id, messages).map(|_| ())\n    }\n\n    /// Persist messages and return the durable message row ID for each input position.\n    ///\n    /// Full-history clients resend old messages every turn. Returning row IDs lets\n    /// rebuildable projections key themselves to durable source rows rather than the\n    /// transient request batch, so replaying the same history is idempotent.\n    pub fn store_messages_with_ids(\n        &self,\n        conv_id: i64,\n        messages: &serde_json::Value,\n    ) -> anyhow::Result<Vec<i64>> {\n        let conn = self.writer.lock().unwrap_or_else(|e| e.into_inner());\n        let tx = conn.unchecked_transaction()?;\n        let mut message_ids = Vec::new();'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''                let msg_id: i64 = tx.query_row(\n                    "SELECT id FROM messages WHERE conversation_id = ?1 AND content_hash = ?2",\n                    rusqlite::params![conv_id, content_hash],\n                    |r| r.get(0),\n                )?;\n                // Mirror into FTS5 index (ignore duplicates from message dedup)'''
          new = '''                let msg_id: i64 = tx.query_row(\n                    "SELECT id FROM messages WHERE conversation_id = ?1 AND content_hash = ?2",\n                    rusqlite::params![conv_id, content_hash],\n                    |r| r.get(0),\n                )?;\n                message_ids.push(msg_id);\n                // Mirror into FTS5 index (ignore duplicates from message dedup)'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          old = '''        Ok(())\n    }\n\n    /// Legacy: create conversation + store messages in one call.'''
          new = '''        Ok(message_ids)\n    }\n\n    /// Atomically create a level-0 DAG leaf for a durable message source if that\n    /// source has not been projected yet. Returns None when the projection already\n    /// exists, making cumulative-history replay idempotent.\n    pub fn insert_message_leaf_if_absent(\n        &self,\n        conv_id: i64,\n        message_id: i64,\n        summary: &str,\n        token_count: i64,\n    ) -> anyhow::Result<Option<DagNode>> {\n        let conn = self.writer.lock().unwrap_or_else(|e| e.into_inner());\n        let tx = conn.unchecked_transaction()?;\n\n        let existing: Option<i64> = tx\n            .query_row(\n                "SELECT dag_node_id FROM message_dag_projection WHERE message_id = ?1",\n                rusqlite::params![message_id],\n                |row| row.get(0),\n            )\n            .ok();\n        if existing.is_some() {\n            return Ok(None);\n        }\n\n        let hash = Self::semantic_hash(summary, &[]);\n        tx.execute(\n            "INSERT INTO dag_nodes (conversation_id, level, summary, token_count, parent_ids, child_ids, snippets, is_leaf, is_join, deleted, semantic_hash)\n             VALUES (?1, 0, ?2, ?3, '[]', '[]', '[]', 1, 0, 0, ?4)",\n            rusqlite::params![conv_id, summary, token_count, hash],\n        )?;\n        let node_id = tx.last_insert_rowid();\n        tx.execute(\n            "INSERT INTO message_dag_projection (message_id, dag_node_id) VALUES (?1, ?2)",\n            rusqlite::params![message_id, node_id],\n        )?;\n        tx.commit()?;\n\n        Ok(Some(DagNode {\n            id: node_id,\n            conversation_id: conv_id,\n            level: 0,\n            summary: summary.to_string(),\n            token_count,\n            parent_ids: Vec::new(),\n            child_ids: Vec::new(),\n            is_leaf: true,\n            is_join: false,\n            snippets: Vec::new(),\n            deleted: false,\n            semantic_hash: hash,\n            access_count: 0,\n            last_accessed_at: None,\n            reasoning: String::new(),\n            graph_revision: 0,\n            compaction_id: String::new(),\n        }))\n    }\n\n    /// Legacy: create conversation + store messages in one call.'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)

          # Add focused DB tests before DAG persistence tests.
          marker = '''    // ── P0: DAG node persistence ────────────────────────────────────────'''
          tests = '''    #[tokio::test]\n    async fn store_messages_with_ids_reuses_durable_source_rows() {\n        let dir = tempdir().unwrap();\n        let db = Database::builder()\n            .path(dir.path().join("message_ids.db"))\n            .build()\n            .await\n            .unwrap();\n        let conv_id = db.find_or_create_conversation("ids", "test").unwrap();\n\n        let first = db.store_messages_with_ids(\n            conv_id,\n            &json!([{\"role\":\"user\",\"content\":\"a\"}]),\n        ).unwrap();\n        let replay = db.store_messages_with_ids(\n            conv_id,\n            &json!([\n                {\"role\":\"user\",\"content\":\"a\"},\n                {\"role\":\"assistant\",\"content\":\"b\"}\n            ]),\n        ).unwrap();\n\n        assert_eq!(first.len(), 1);\n        assert_eq!(replay.len(), 2);\n        assert_eq!(first[0], replay[0]);\n        assert_ne!(replay[0], replay[1]);\n    }\n\n    #[tokio::test]\n    async fn message_leaf_projection_is_idempotent_by_source_row() {\n        let dir = tempdir().unwrap();\n        let db = Database::builder()\n            .path(dir.path().join("message_leaf_projection.db"))\n            .build()\n            .await\n            .unwrap();\n        let conv_id = db.find_or_create_conversation("leaf-source", "test").unwrap();\n        let ids = db.store_messages_with_ids(\n            conv_id,\n            &json!([{\"role\":\"assistant\",\"content\":\"already persisted\"}]),\n        ).unwrap();\n\n        let first = db.insert_message_leaf_if_absent(conv_id, ids[0], "already persisted", 4).unwrap();\n        let second = db.insert_message_leaf_if_absent(conv_id, ids[0], "already persisted", 4).unwrap();\n\n        assert!(first.is_some());\n        assert!(second.is_none());\n        assert_eq!(db.get_leaf_nodes(conv_id).unwrap().len(), 1);\n    }\n\n'''
          assert s.count(marker) == 1
          s = s.replace(marker, tests + marker, 1)
          p.write_text(s)

          # dag.rs: expose source-backed leaf insertion and update revision only on new leaf.
          replace_once('src/dag.rs', '''    /// Store a new leaf node (level 0) for raw messages.\n    pub fn insert_leaf(&self, conv_id: i64, summary: &str, token_count: i64) -> anyhow::Result<DagNode> {\n        let node = self.db.insert_dag_node(conv_id, 0, summary, token_count, &[], &[], true)?;\n        self.post_mutation(conv_id)?;\n        Ok(node)\n    }''', '''    /// Store a new leaf node (level 0) for raw messages.\n    pub fn insert_leaf(&self, conv_id: i64, summary: &str, token_count: i64) -> anyhow::Result<DagNode> {\n        let node = self.db.insert_dag_node(conv_id, 0, summary, token_count, &[], &[], true)?;\n        self.post_mutation(conv_id)?;\n        Ok(node)\n    }\n\n    /// Project one durable message row into the DAG exactly once.\n    /// Returns None if that source message already has a level-0 projection.\n    pub fn insert_message_leaf(\n        &self,\n        conv_id: i64,\n        message_id: i64,\n        summary: &str,\n        token_count: i64,\n    ) -> anyhow::Result<Option<DagNode>> {\n        let node = self\n            .db\n            .insert_message_leaf_if_absent(conv_id, message_id, summary, token_count)?;\n        if node.is_some() {\n            self.post_mutation(conv_id)?;\n        }\n        Ok(node)\n    }''')

          # pipeline.rs: resolve durable source IDs once, project each source at most once.
          replace_once('src/pipeline.rs', '''            db.store_messages(conv_id, &msgs)\n                .context("failed to store pipeline messages")?;''', '''            let message_ids = db\n                .store_messages_with_ids(conv_id, &msgs)\n                .context("failed to store pipeline messages")?;''')
          replace_once('src/pipeline.rs', '''            if let Some(arr) = msgs.as_array() {\n                for msg in arr {\n                    if let Some(content) = dag_leaf_content(msg) {\n                        let raw_tokens = crate::tokenizer::count(&content) + overhead;\n                        let tc = crate::tokenizer::correct(raw_tokens, correction) as i64;\n                        dag.insert_leaf(conv_id, &content, tc)\n                            .context("failed to create DAG leaf")?;\n                    }\n                }''', '''            if let Some(arr) = msgs.as_array() {\n                for (msg, message_id) in arr.iter().zip(message_ids.iter().copied()) {\n                    if let Some(content) = dag_leaf_content(msg) {\n                        let raw_tokens = crate::tokenizer::count(&content) + overhead;\n                        let tc = crate::tokenizer::correct(raw_tokens, correction) as i64;\n                        dag.insert_message_leaf(conv_id, message_id, &content, tc)\n                            .context("failed to create source-backed DAG leaf")?;\n                    }\n                }''')

          # responses_projection.rs: same source-backed projection rule.
          replace_once('src/responses_projection.rs', '''        db.store_messages(conv_id, &stored_messages)?;\n        if let Some(items) = stored_messages.as_array() {\n            for message in items {''', '''        let message_ids = db.store_messages_with_ids(conv_id, &stored_messages)?;\n        if let Some(items) = stored_messages.as_array() {\n            for (message, message_id) in items.iter().zip(message_ids.iter().copied()) {''')
          replace_once('src/responses_projection.rs', '''                dag.insert_leaf(conv_id, content, token_count)?;''', '''                dag.insert_message_leaf(conv_id, message_id, content, token_count)?;''')
          PY

          git diff --check
          cargo test --lib
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets
          cargo build --release
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/db.rs src/dag.rs src/pipeline.rs src/responses_projection.rs
          git commit -m "refactor: make level-zero DAG projection incremental"
          git push origin HEAD:v41-incremental-level0-projection
